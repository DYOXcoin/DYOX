
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto World</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background: rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            color: #00ffd5;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #00ffd5;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h2 {
            font-size: 40px;
        }

        .hero button {
            padding: 12px 25px;
            border: none;
            background: #00ffd5;
            color: black;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .hero button:hover {
            background: white;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 50px;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            width: 250px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.5);
        }
    </style>
</head>

<body>

<header>
    <h1>CryptoX</h1>
    <nav>
        <a href="#">الرئيسية</a>
        <a href="#">الخدمات</a>
        <a href="#">عن الموقع</a>
        <a href="#">اتصل بنا</a>
    </nav>
</header>

<section class="hero">
    <h2>اكتشف عالم العملات الرقمية 🚀</h2>
    <p>أفضل منصة لعرض وتحليل العملات النادرة</p>
    <button onclick="showMessage()">ابدأ الآن</button>
</section>

<section class="cards">
    <div class="card">
        <h3>تحليل العملات</h3>
        <p>نقدم أفضل التحليلات للأسواق الرقمية</p>
    </div>

    <div class="card">
        <h3>فرص نادرة</h3>
        <p>اكتشف العملات ذات المعروض المحدود</p>
    </div>

    <div class="card">
        <h3>أخبار السوق</h3>
        <p>تابع آخر الأخبار والتحديثات</p>
    </div>
</section>

<footer>
    <p>© 2026 جميع الحقوق محفوظة</p>
</footer>

<script>
    function showMessage() {
        alert("مرحباً بك في موقع CryptoX 🚀");
    }
</script>

</body>
</html>
