<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DYOR - المستكشف الرقمي</title>
    <!-- تضمين سكريبت تيليجرام ويب آلاف لضمان التوافق -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
            transition: all 0.3s ease;
        }
        .btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك في DYOR</h1>
        <p>اضغط على الزر أدناه لفتح المنصة واستكشاف أحدث بيانات العملات والتحليلات مباشرة.</p>
        <a href="https://dyor.io/" class="btn" id="openBtn">Open</a>
    </div>

    <script>
        // تهيئة تيليجرام ويب آلاف
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.expand(); // توسيع الواجهة لملء الشاشة
        }
    </script>

</body>
</html>
