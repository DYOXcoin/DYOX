<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DYOX | Next-Generation Liquidity Infrastructure on TON</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0b0e11;
            --bg-card: #151a21;
            --primary: #00d285;
            --primary-hover: #00b371;
            --ton-blue: #0088cc;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --border-color: #2b3139;
            --glow: 0 0 20px rgba(0, 210, 133, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Global Components */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #00b3a4);
            color: #000;
            box-shadow: var(--glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 210, 133, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 50px;
            background: linear-gradient(135deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: var(--primary);
            margin: 15px auto 0;
            border-radius: 2px;
        }

        /* Navbar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(11, 14, 17, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo span {
            color: var(--primary);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav ul a:hover, nav ul a.active {
            color: var(--primary);
        }

        /* Hero Section */
        .hero {
            padding: 180px 0 100px;
            background: radial-gradient(circle at 10% 20%, rgba(0, 210, 133, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(0, 136, 204, 0.05) 0%, transparent 40%);
            text-align: center;
        }

        .hero-badge {
            background: rgba(0, 210, 133, 0.1);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 210, 133, 0.2);
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 25px;
        }

        .hero h1 span {
            background: linear-gradient(135deg, var(--primary), var(--ton-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto 40px;
        }

        .hero-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 80px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .stat-card h3 {
            font-size: 2rem;
            color: #fff;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card h3 span {
            color: var(--primary);
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Core Features / Problem & Solution */
        .features {
            padding: 100px 0;
            background: #0f1318;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 40px;
        }

        .info-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 16px;
        }

        .info-box h3 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .info-box.problem h3 { color: #ff4d4d; }
        .info-box.solution h3 { color: var(--primary); }

        .info-list {
            list-style: none;
        }

        .info-list li {
            position: relative;
            padding-right: 30px;
            margin-bottom: 18px;
            color: var(--text-main);
        }

        .info-list li i {
            position: absolute;
            right: 0;
            top: 5px;
            font-size: 1.1rem;
        }

        .info-box.problem .info-list li i { color: #ff4d4d; }
        .info-box.solution .info-list li i { color: var(--primary); }

        /* Tokenomics */
        .tokenomics {
            padding: 100px 0;
        }

        .token-info-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .token-details h3 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .token-details p {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .distribution-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .dist-item {
            background: var(--bg-card);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .dist-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .dist-info .label { color: var(--text-main); }
        .dist-info .pct { color: var(--primary); }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--ton-blue));
            border-radius: 3px;
        }

        /* Interactive Social Platform Sandbox (The X-Style Hub) */
        .social-hub {
            padding: 100px 0;
            background: #0f1318;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .hub-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            align-items: start;
        }

        .hub-sidebar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            position: sticky;
            top: 100px;
        }

        .user-profile-preview {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .user-profile-preview .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--ton-blue));
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #000;
            font-weight: 900;
        }

        .user-profile-preview h4 {
            font-size: 1.2rem;
            color: #fff;
        }

        .user-profile-preview p {
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .hub-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hub-menu li a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }

        .hub-menu li a:hover, .hub-menu li.active a {
            background: rgba(0, 210, 133, 0.1);
            color: var(--primary);
        }

        /* Feed Area */
        .feed-area {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Publisher Card */
        .publisher {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
        }

        .publisher-input-wrapper {
            display: flex;
            gap: 15px;
        }

        .publisher .avatar {
            width: 45px;
            height: 45px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 700;
            flex-shrink: 0;
        }

        .publisher textarea {
            width: 100%;
            background: transparent;
            border: none;
            resize: none;
            color: var(--text-main);
            font-size: 1.1rem;
            padding-top: 10px;
            outline: none;
            min-height: 60px;
        }

        .publisher-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .media-triggers {
            display: flex;
            gap: 15px;
        }

        .media-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
            position: relative;
        }

        .media-btn:hover {
            color: var(--primary-hover);
        }

        .media-btn input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* URL Importer fields */
        .url-input-field {
            display: none;
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
        }

        /* Posts */
        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            transition: border-color 0.3s;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .post-header .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
        }

        .post-author-info h5 {
            font-size: 1.05rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .post-author-info h5 .badge {
            background: rgba(0, 136, 204, 0.2);
            color: var(--ton-blue);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .post-author-info p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .post-body {
            font-size: 1.05rem;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .post-media {
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: var(--bg-dark);
            max-height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-media img, .post-media video {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
        }

        /* Post Rating & Actions */
        .post-rating-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .rating-stars {
            display: flex;
            gap: 5px;
            color: #ffc107;
            cursor: pointer;
        }

        .rating-stars i {
            transition: transform 0.1s;
        }

        .rating-stars i:hover {
            transform: scale(1.2);
        }

        .rating-avg {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .post-actions {
            display: flex;
            justify-content: space-around;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .action-btn:hover { color: var(--primary); }
        .action-btn.liked { color: #e0245e; }
        .action-btn.shared { color: var(--ton-blue); }

        /* Comments Section */
        .comments-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .comment-box {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .comment-box .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #4f5d73;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: #fff;
            flex-shrink: 0;
        }

        .comment-content h6 {
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        .comment-content p {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .comment-input-wrapper {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .comment-input-wrapper input {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 15px;
            color: #fff;
            outline: none;
        }

        .comment-input-wrapper input:focus {
            border-color: var(--primary);
        }

        /* Roadmap Timeline */
        .roadmap {
            padding: 100px 0;
        }

        .timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .timeline::after {
            content: '';
            position: absolute;
            width: 2px;
            background: var(--border-color);
            top: 0;
            bottom: 0;
            right: 50%;
            margin-right: -1px;
        }

        .timeline-item {
            padding: 10px 40px;
            position: relative;
            background: transparent;
            width: 50%;
        }

        .timeline-item.right {
            left: 0;
            right: auto;
            text-align: left;
            direction: ltr;
        }

        .timeline-item.left {
            right: 0;
            left: auto;
            text-align: right;
            direction: rtl;
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
