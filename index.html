<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineX - Earn & Mining Platform</title>
    <!-- استدعاء خطوط وتصميمات فائقة الدقة -->
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-green: #00ff88;
            --accent-pink: #ff3366;
            --text-primary: #ffffff;
            --text-secondary: #8a99ad;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #0055ff, #00ff88);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .wallet-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .device-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
        .device-card img {
            max-width: 100%;
            height: auto;
            margin: 15px 0;
        }
        .actions-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-boost {
            flex: 1;
            background: linear-gradient(135deg, #ff3366, #ff6b6b);
            border: none;
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-earn {
            flex: 1;
            background: linear-gradient(135deg, #f7931a, #ffb142);
            border: none;
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .balance-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .balance-amount {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-green);
        }
        .collect-btn {
            background: #1a2634;
            color: #3b82f6;
            border: 1px solid #3b82f6;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .mining-data {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
        }
        .mining-data h3 {
            margin-bottom: 10px;
            font-size: 16px;
            color: var(--text-secondary);
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        /* نافذة محفظة TON البرمجية */
        #wallet-info {
            margin-top: 15px;
            font-size: 13px;
            color: var(--accent-green);
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الرأس ومعلومات الحساب -->
        <div class="header">
            <div class="user-info">
                <div class="avatar">N</div>
                <div>
                    <h4>Earn</h4>
                    <span style="font-size: 12px; color: var(--text-secondary);">@earnqj</span>
                </div>
            </div>
            <button class="wallet-btn" id="connectWalletBtn">
                <span>👛</span> ربط المحفظة
            </button>
        </div>

        <!-- بطاقة الجهاز الأساسي للتعدين -->
        <div class="device-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: bold;">My Devices</span>
                <span style="background: rgba(0,255,136,0.1); color: var(--accent-green); padding: 4px 10px; border-radius: 8px; font-size: 12px;">Stable</span>
            </div>
            <!-- عرض صورة الجهاز -->
            <img src="https://assets.coingecko.com/nft_contracts/images/unknown/default.png" alt="MineX GPU" id="deviceImg">
            <h3 style="color: var(--text-secondary);">MineX</h3>
        </div>

        <!-- أزرار التفاعل السريع -->
        <div class="actions-row">
            <button class="btn-boost">🚀 Boost</button>
            <button class="btn-earn">⚡ Earn</button>
        </div>

        <!-- قسم الرصيد والأرباح -->
        <div class="balance-section">
            <div>
                <div class="balance-amount" id="balanceDisplay">0,00</div>
                <div style="font-size: 12px; color: var(--text-secondary);">Updates every 5 min</div>
            </div>
            <button class="collect-btn" onclick="collectEarnings()">Collect All</button>
        </div>

        <!-- جدول بيانات التعدين -->
        <div class="mining-data">
            <h3>Mining Data</h3>
            <div class="data-row">
                <span>Radeon RX... (4.00 TH/s)</span>
                <span style="color: var(--accent-green);">665.28K</span>
            </div>
            <div class="data-row">
                <span>NVIDIA 20... (24.00 TH/s)</span>
                <span style="color: var(--accent-green);">1.30M</span>
            </div>
        </div>

        <!-- عنصر عرض تفاصيل المحفظة -->
        <div id="wallet-info"></div>
    </div>

    <!-- سكربت التشغيل والتفاعل اللحظي -->
    <script>
        // محاكاة التحديث اللحظي للرصيد
        let currentBalance = 0.00;
        setInterval(() => {
            currentBalance += 0.01;
            document.getElementById('balanceDisplay').innerText = currentBalance.toFixed(2);
        }, 3000);

        function collectEarnings() {
            if(currentBalance > 0) {
                alert("تم جمع الأرباح بنجاح وإضافتها إلى رصيدك!");
                currentBalance = 0.00;
                document.getElementById('balanceDisplay').innerText = "0.00";
            } else {
                alert("لا توجد أرباح كافية للجمع حالياً.");
            }
        }

        // ربط زر المحفظة بوظيفة تفاعلية وهمية/حقيقية لـ TON
        document.getElementById('connectWalletBtn').addEventListener('click', function() {
            const walletInfo = document.getElementById('wallet-info');
            walletInfo.innerHTML = "<strong>المحفظة المتصلة:</strong> EQDKf5t_2G1b0WKIdru8UPB9k5KQgomS7kuOHWPF-n8VgDam";
            this.style.background = "#00ff88";
            this.style.color = "#000";
            this.innerText = "متصل";
        });
    </script>
</body>
</html>
